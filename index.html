<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Kiddies | Premium Kids Wear Management</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script>
        window.addEventListener('error', function (e) {
            if (e.message && (e.message.includes('Loading chunk') || e.message.includes('Importing a module script failed'))) {
                console.warn('Chunk loading error detected, reloading page');
                window.location.reload();
            }
        }, true);
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#01a9fb',
                        secondary: '#fe569f',
                        accent: '#01a9fb',
                        highlight: '#fe569f',
                        brandBlue: '#01a9fb',
                        brandPink: '#fe569f',
                        brandYellow: '#FACC15',
                        surface: '#ffffff',
                        background: '#F8FAFC',
                        muted: '#64748B',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                    borderRadius: {
                        DEFAULT: '4px',
                        'none': '0px',
                        'sm': '2px',
                        'md': '4px',
                        'lg': '6px',
                        'xl': '6px',
                        '2xl': '6px',
                        '3xl': '6px',
                        'full': '9999px',
                    },
                    boxShadow: {
                        'sm': 'none',
                        'DEFAULT': 'none',
                        'md': 'none',
                        'lg': 'none',
                        'xl': 'none',
                        '2xl': 'none',
                        'inner': 'none',
                        'xs': 'none',
                        'card': 'none',
                        'elevated': 'none',
                        'dropdown': 'none',
                    },
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        /* ── Design Tokens ── */
        :root {
            --color-bg: #F9FAFB;
            --color-surface: #FFFFFF;
            --color-border: #E5E7EB;
            --color-border-light: #F3F4F6;
            --color-text-primary: #111827;
            --color-text-secondary: #6B7280;
            --color-text-muted: #9CA3AF;
            --color-primary: #01a9fb;
            --color-secondary: #fe569f;
            --color-yellow: #FACC15;
            --color-accent: #01a9fb;
        }

        /* ── Base Typography ── */
        html {
            font-size: 16px;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text-primary);
            font-size: 14px;
            line-height: 1.6;
            letter-spacing: -0.011em;
        }

        h1,
        h2,
        h3,
        h4 {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        /* ── Font Size Normalization ── */
        .text-\[7px\] {
            font-size: 10px !important;
        }

        .text-\[7\.5px\] {
            font-size: 10.5px !important;
        }

        .text-\[8px\] {
            font-size: 11px !important;
        }

        .text-\[8\.5px\] {
            font-size: 11.5px !important;
        }

        .text-\[9px\] {
            font-size: 12px !important;
        }

        .text-\[9\.5px\] {
            font-size: 12.5px !important;
        }

        .text-\[10px\] {
            font-size: 12.5px !important;
        }

        .text-\[11px\] {
            font-size: 13px !important;
        }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #D1D5DB;
            border-radius: 100px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #9CA3AF;
        }

        /* ── Utility Classes ── */
        .nano-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border-light);
            border-radius: 10px;
            transition: all 0.15s ease;
        }

        .nano-card:hover {
            border-color: var(--color-border);
            box-shadow: 0 2px 8px 0 rgba(0, 0, 0, 0.04);
        }

        /* ── Animations ── */
        @keyframes nanoSlideUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-nano {
            animation: nanoSlideUp 0.3s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.2s ease-out forwards;
        }

        .dot-pulse {
            animation: dotPulse 1.4s infinite ease-in-out both;
        }

        @keyframes dotPulse {

            0%,
            80%,
            100% {
                transform: scale(0.6);
                opacity: 0.3;
            }

            40% {
                transform: scale(1.3);
                opacity: 1;
            }
        }

        /* ── Spacing Normalization ── */
        .space-y-6>:not([hidden])~:not([hidden]) {
            margin-top: 1rem;
        }

        .p-10 {
            padding: 1.5rem !important;
        }

        .p-8 {
            padding: 1.25rem !important;
        }

        .p-6 {
            padding: 1rem !important;
        }

        .gap-8 {
            gap: 1.5rem !important;
        }

        .gap-6 {
            gap: 1rem !important;
        }

        .mb-10 {
            margin-bottom: 1.5rem !important;
        }

        .mb-8 {
            margin-bottom: 1.25rem !important;
        }

        .mb-6 {
            margin-bottom: 1rem !important;
        }

        .py-12 {
            padding-top: 2rem !important;
            padding-bottom: 2rem !important;
        }

        .py-10 {
            padding-top: 1.5rem !important;
            padding-bottom: 1.5rem !important;
        }

        .h-16 {
            height: 3rem !important;
        }

        .w-16 {
            width: 3rem !important;
        }

        /* ── Input Styles ── */
        input,
        select,
        textarea {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        button {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        /* ── Selection ── */
        ::selection {
            background: rgba(1, 169, 251, 0.2);
            color: inherit;
        }

        /* ── Mobile PWA Utilities ── */
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        /* Safe area padding for bottom nav on notch devices */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        /* Scroll snap for mobile horizontal scroll strips */
        .snap-x {
            scroll-snap-type: x mandatory;
        }

        .snap-start {
            scroll-snap-align: start;
        }

        .snap-center {
            scroll-snap-align: center;
        }

        /* Touch-friendly momentum scrolling */
        .scroll-smooth-touch {
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-900">
    <div id="root">
        <div
            style="height: 100vh; width: 100vw; display: flex; align-items: center; justify-content: center; background-color: #F9FAFB;">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 20px;">
                <img src="/logo.png" alt="Kiddies Logo"
                    style="height: auto; width: 150px; max-width: 60vw; object-fit: contain; filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.08));" />
                <div style="display: flex; align-items: center; gap: 8px; margin-top: 8px;">
                    <div class="dot-pulse"
                        style="width: 8px; height: 8px; border-radius: 50%; background-color: #01a9fb; animation-delay: 0s;">
                    </div>
                    <div class="dot-pulse"
                        style="width: 8px; height: 8px; border-radius: 50%; background-color: #fe569f; animation-delay: 0.2s;">
                    </div>
                    <div class="dot-pulse"
                        style="width: 8px; height: 8px; border-radius: 50%; background-color: #FACC15; animation-delay: 0.4s;">
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
