<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Kiddies | Premium Kids Wear Management</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script>
        window.addEventListener('error', function(e) {
            if (e.message && (e.message.includes('Loading chunk') || e.message.includes('Importing a module script failed'))) {
                console.warn('Chunk loading error detected, reloading page');
                window.location.reload();
            }
        }, true);
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1E293B', // Slate 800
                        secondary: '#FACC15', // Yellow 400
                        accent: '#0EA5E9', // Sky 500
                        highlight: '#FACC15',
                        surface: '#ffffff',
                        background: '#F8FAFC', // Slate 50
                    },
                    borderRadius: {
                        'brand': '0.5rem',
                        'brand-lg': '0.75rem',
                        'brand-xl': '1rem',
                        'brand-2xl': '1.25rem',
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Inter', 'ui-sans-serif', 'system-ui', 'sanrif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    boxShadow: {
                        'nano': '0 1px 2px 0 rgba(0, 0, 0, 0.03)',
                        'banana': '0 2px 4px 0 rgba(250, 204, 21, 0.08)',
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --nano-primary: #1E293B;
            --nano-banana: #FACC15;
            --nano-bg: #F8FAFC;
            --nano-surface: #FFFFFF;
            --nano-line: #F1F5F9;
        }

        html {
            font-size: 16px;
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
            background-color: var(--nano-bg);
            color: var(--nano-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            font-size: 15px;
            line-height: 1.5;
            letter-spacing: -0.012em;
        }

        h1,
        h2,
        h3,
        h4 {
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Universal Font Size Boost & Sharp Typography */
        .text-\[7px\] { font-size: 9.5px !important; }
        .text-\[7\.5px\] { font-size: 10px !important; }
        .text-\[8px\] { font-size: 10.5px !important; }
        .text-\[8\.5px\] { font-size: 11px !important; }
        .text-\[9px\] { font-size: 11.5px !important; }
        .text-\[9\.5px\] { font-size: 12px !important; }
        .text-\[10px\] { font-size: 12.5px !important; }
        .text-\[11px\] { font-size: 13.5px !important; }
        .text-xs { font-size: 0.85rem !important; }
        .text-sm { font-size: 0.95rem !important; }

        /* Nano Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #E2E8F0;
            border-radius: 8px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #CBD5E1;
        }

        /* App Utilities */
        .border-nano {
            border: 1px solid var(--nano-line);
        }

        .bg-banana {
            background-color: var(--nano-banana);
        }

        .text-banana {
            color: var(--nano-banana);
        }

        .nano-card {
            background: var(--nano-surface);
            border: 1px solid #F1F5F9;
            border-radius: 0.75rem;
            transition: border-color 0.15s ease, background-color 0.15s ease;
        }

        .nano-card:hover {
            border-color: #CBD5E1;
            box-shadow: 0 2px 4px 0 rgba(0, 0, 0, 0.03);
        }

        .banana-btn {
            background: var(--nano-banana);
            color: var(--nano-primary);
            font-weight: 600;
            font-size: 13px;
            padding: 8px 16px;
            border-radius: 0.5rem;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .banana-btn:hover {
            background: #EAB308;
        }

        /* Animation */
        @keyframes nanoSlideUp {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-nano {
            animation: nanoSlideUp 0.4s ease-out forwards;
        }

        /* Compact spacing overrides */
        .space-y-6> :not([hidden])~ :not([hidden]) {
            margin-top: 1rem;
        }

        .p-10 {
            padding: 1.5rem !important;
        }

        .p-8 {
            padding: 1.25rem !important;
        }

        .p-6 {
            padding: 1rem !important;
        }

        .gap-8 {
            gap: 1.5rem !important;
        }

        .gap-6 {
            gap: 1rem !important;
        }

        .mb-10 {
            margin-bottom: 1.5rem !important;
        }

        .mb-8 {
            margin-bottom: 1.25rem !important;
        }

        .mb-6 {
            margin-bottom: 1rem !important;
        }

        .py-12 {
            padding-top: 2rem !important;
            padding-bottom: 2rem !important;
        }

        .py-10 {
            padding-top: 1.5rem !important;
            padding-bottom: 1.5rem !important;
        }

        .h-16 {
            height: 3rem !important;
        }

        .w-16 {
            width: 3rem !important;
        }

        .text-3xl {
            font-size: 1.5rem !important;
        }

        .text-2xl {
            font-size: 1.25rem !important;
        }

        .text-xl {
            font-size: 1.125rem !important;
        }

        .dot-pulse {
            animation: dotPulse 1.4s infinite ease-in-out both;
        }
        @keyframes dotPulse {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
            40% { transform: scale(1.3); opacity: 1; }
        }
    </style>
    <!-- Removed importmap to prevent browser CDN conflicts with Vite's bundled dependencies -->
</head>

<body class="bg-gray-50 text-gray-900">
    <div id="root">
        <div style="height: 100vh; width: 100vw; display: flex; align-items: center; justify-content: center; background-color: #ffffff;">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 20px;">
                <img src="/logo.png" alt="Kiddies Logo" style="height: auto; width: 210px; max-width: 80vw; object-fit: contain; filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.1));" />
                <div style="display: flex; align-items: center; gap: 8px; margin-top: 8px;">
                    <div class="dot-pulse" style="width: 10px; height: 10px; border-radius: 50%; background-color: #0EA5E9; animation-delay: 0s;"></div>
                    <div class="dot-pulse" style="width: 10px; height: 10px; border-radius: 50%; background-color: #8B5CF6; animation-delay: 0.2s;"></div>
                    <div class="dot-pulse" style="width: 10px; height: 10px; border-radius: 50%; background-color: #EC4899; animation-delay: 0.4s;"></div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
