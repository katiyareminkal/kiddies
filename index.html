<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Kiddies | Stock & Rental Management Suite</title>
    <meta name="description" content="Stock & Rental Management Suite" />
    <meta property="og:title" content="Kiddies | Stock & Rental Management Suite" />
    <meta property="og:description" content="Stock & Rental Management Suite" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png">
    <link rel="apple-touch-startup-image" href="/icon-512.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script>
        window.deferredPWAInstallPrompt = null;
        window.addEventListener('beforeinstallprompt', function(e) {
            e.preventDefault();
            window.deferredPWAInstallPrompt = e;
            window.dispatchEvent(new CustomEvent('pwa-install-ready'));
        });
        window.addEventListener('error', function (e) {
            if (e.message && (e.message.includes('Loading chunk') || e.message.includes('Importing a module script failed'))) {
                console.warn('Chunk loading error detected, reloading page');
                window.location.reload();
            }
        }, true);
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#01a9fb',
                        secondary: '#fe569f',
                        accent: '#01a9fb',
                        highlight: '#fe569f',
                        brandBlue: '#01a9fb',
                        brandPink: '#fe569f',
                        brandYellow: '#FACC15',
                        surface: '#ffffff',
                        background: '#F8FAFC',
                        muted: '#64748B',
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Inter', 'system-ui', '-apple-system', 'sans-serif'],
                        display: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
                    },
                    borderRadius: {
                        'xs': '4px',
                        'sm': '6px',
                        DEFAULT: '8px',
                        'md': '10px',
                        'lg': '12px',
                        'xl': '14px',
                        '2xl': '18px',
                        '3xl': '24px',
                        'full': '9999px',
                    },
                    boxShadow: {
                        'xs': '0 1px 2px 0 rgba(15, 23, 42, 0.04)',
                        'sm': '0 1px 3px 0 rgba(15, 23, 42, 0.06), 0 1px 2px -1px rgba(15, 23, 42, 0.06)',
                        'DEFAULT': '0 2px 6px -1px rgba(15, 23, 42, 0.06), 0 2px 4px -2px rgba(15, 23, 42, 0.06)',
                        'md': '0 4px 10px -2px rgba(15, 23, 42, 0.07), 0 2px 6px -2px rgba(15, 23, 42, 0.05)',
                        'lg': '0 12px 20px -4px rgba(15, 23, 42, 0.08), 0 4px 8px -4px rgba(15, 23, 42, 0.05)',
                        'xl': '0 20px 28px -6px rgba(15, 23, 42, 0.09), 0 8px 12px -6px rgba(15, 23, 42, 0.05)',
                        '2xl': '0 25px 50px -12px rgba(15, 23, 42, 0.18)',
                        'card': '0 1px 3px 0 rgba(15, 23, 42, 0.05), 0 1px 2px -1px rgba(15, 23, 42, 0.05)',
                        'elevated': '0 12px 32px -4px rgba(15, 23, 42, 0.10), 0 4px 12px -2px rgba(15, 23, 42, 0.06)',
                        'dropdown': '0 14px 34px -4px rgba(15, 23, 42, 0.14), 0 6px 14px -2px rgba(15, 23, 42, 0.08)',
                    },
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        /* ── Design Tokens ── */
        :root {
            --color-bg: #F8FAFC;
            --color-surface: #FFFFFF;
            --color-border: #E2E8F0;
            --color-border-light: #F1F5F9;
            --color-text-primary: #0F172A;
            --color-text-secondary: #475569;
            --color-text-muted: #94A3B8;
            --color-primary: #01a9fb;
            --color-secondary: #fe569f;
            --color-yellow: #FACC15;
            --color-accent: #01a9fb;
        }

        /* ── Base Typography ── */
        html {
            font-size: 16px;
            font-family: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text-primary);
            font-size: 14px;
            line-height: 1.55;
            letter-spacing: -0.012em;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        /* ── Modern Sleek Scrollbar ── */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 9999px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94A3B8;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #E2E8F0;
            border-radius: 9999px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #CBD5E1;
        }

        /* ── Cards & Elements ── */
        .nano-card {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .nano-card:hover {
            border-color: #CBD5E1;
            box-shadow: 0 6px 18px -3px rgba(15, 23, 42, 0.05);
        }

        /* ── Animations ── */
        @keyframes nanoSlideUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-nano {
            animation: nanoSlideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.2s ease-out forwards;
        }

        .dot-pulse {
            animation: dotPulse 1.4s infinite ease-in-out both;
        }

        @keyframes dotPulse {
            0%,
            80%,
            100% {
                transform: scale(0.6);
                opacity: 0.3;
            }

            40% {
                transform: scale(1.3);
                opacity: 1;
            }
        }

        /* ── Input & Controls ── */
        input,
        select,
        textarea {
            font-family: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif;
        }

        button {
            font-family: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif;
            user-select: none;
        }

        /* ── Selection ── */
        ::selection {
            background: rgba(1, 169, 251, 0.22);
            color: #0284c7;
        }

        /* ── Mobile PWA Utilities ── */
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        /* Safe area padding for bottom nav on notch devices */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        /* Scroll snap for mobile horizontal scroll strips */
        .snap-x {
            scroll-snap-type: x mandatory;
        }

        .snap-start {
            scroll-snap-align: start;
        }

        /* ── High-End Brand Launch Splash Animation ── */
        @keyframes brandSplashEntrance {
            0% {
                opacity: 0;
                transform: scale(0.92) translateY(6px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes brandLogoFloat {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-4px);
            }
        }

        @keyframes brandProgressBar {
            0% {
                width: 0%;
                opacity: 0.8;
            }
            50% {
                width: 70%;
                opacity: 1;
            }
            100% {
                width: 100%;
                opacity: 0.9;
            }
        }

        .brand-splash-container {
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            user-select: none;
            overflow: hidden;
        }

        .brand-splash-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            animation: brandSplashEntrance 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .brand-splash-logo {
            height: 110px;
            width: auto;
            max-width: 60vw;
            object-fit: contain;
            filter: drop-shadow(0 8px 24px rgba(1, 169, 251, 0.16));
            animation: brandLogoFloat 2.8s ease-in-out infinite 0.6s;
        }

        .brand-progress-track {
            width: 140px;
            height: 3px;
            background: #f1f5f9;
            border-radius: 9999px;
            overflow: hidden;
            position: relative;
        }

        .brand-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #01a9fb, #fe569f, #FACC15);
            border-radius: 9999px;
            animation: brandProgressBar 1.6s ease-in-out infinite;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-900">
    <div id="root">
        <div class="brand-splash-container">
            <div class="brand-splash-content">
                <img src="/icon.png" alt="Logo" class="brand-splash-logo" />
                <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
                    <span style="font-size: 14px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.12em; color: #0f172a;">Stock & Rentals</span>
                    <span style="font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.16em; color: #01a9fb;">Management Suite</span>
                </div>
                <div class="brand-progress-track">
                    <div class="brand-progress-fill"></div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
